_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Audit a UN mission's flight the way the travel unit would: to the minute, to the day, to the cent"
summary: "An agent audit under a toy handbook paraphrased from the UN's ST/AI/2013/3/Rev.1 (in force 1 July 2024). The model reads one proposed trip, a staff member, consultant, trainee or instructor with a story and a persuasive request, and rules on the business-class entitlement (9-hour legs, 11-hour journeys with a 2-hour cap per connection, 12-hour stopovers), the most economical route within 4 hours of the most direct, the 16-day ticketing and 21-day request deadlines. A deterministic verifier names the exact rule and numbers behind every verdict. Ask it to audit a scenario: geneva-council-session, nairobi-assembly-delegate, bangkok-statistics-keynote, addis-ababa-budget-review, vienna-ozone-workshop, panama-hub-retreat, mogadishu-field-mission, kabul-mission-handover, amman-refugee-briefing, beirut-donor-roundtable, nairobi-interviewer, vienna-narcotics-commission, geneva-trade-forum, bangkok-disaster-drill, new-york-hlpf-panel, santiago-logistician, bangkok-water-dialogue, vienna-miles-collector or rome-food-security-summit."
highlights:
  - "Nineteen proposed trips, each balanced on one edge: 539 vs 540 minutes, 659 vs 660, a 721-minute night in Doha, +239 vs +240, 15 vs 16 days, 20 vs 21"
  - "Travellers argue their case, and the structured facts decide it: the request text never changes the answer"
  - "One correct audit per trip, recomputed by a pure-Python oracle with no LLM judge, and explained with the rule and its numbers"
steps:
  - "Name a scenario, for example kabul-mission-handover"
  - "The model opens the audit case: traveller, dates, proposal and every candidate route"
  - "It rules on the entitled cabin, the violations in canonical order, and compliance"
  - "The verifier stamps the slip and cites the rule behind any error"
